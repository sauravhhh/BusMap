<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BusMap</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='48' height='30' rx='6' fill='%23111'/%3E%3Crect x='13' y='19' width='38' height='12' rx='2' fill='%23fff'/%3E%3Ccircle cx='20' cy='48' r='5' fill='%23111'/%3E%3Ccircle cx='44' cy='48' r='5' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#fff; color:#111; }
  #map { position:fixed; inset:0; z-index:1; }
  .topbar { position:fixed; top:0; left:0; right:0; z-index:1000; background:#fff; border-bottom:1px solid #ececec; padding:13px 16px; display:flex; align-items:center; gap:18px; }
  .topbar h1 { font-size:17px; font-weight:600; letter-spacing:-.2px; flex:1; }
  .topbar h1 img { width:24px; height:24px; border-radius:7px; vertical-align:-5px; margin-right:8px; }
  .tlink { background:none; border:none; font-size:14px; color:#888; cursor:pointer; padding:4px 0; }
  .tlink.on { color:#111; font-weight:700; box-shadow:inset 0 -2px 0 #111; }
  .panel { position:fixed; left:0; right:0; bottom:0; z-index:1000; background:#fff; border-top:1px solid #ececec; max-height:56vh; display:flex; flex-direction:column; transition:transform .25s ease; }
  .panel.hidden { transform:translateY(102%); }
  .grab { padding:10px 0 2px; text-align:center; cursor:pointer; }
  .grab span { display:inline-block; width:36px; height:3px; border-radius:2px; background:#e2e2e2; }
  .tools { display:flex; gap:14px; padding:8px 16px 6px; align-items:center; }
  #search { flex:1; border:none; border-bottom:1px solid #e0e0e0; padding:8px 2px; font-size:14px; outline:none; background:transparent; border-radius:0; }
  #search:focus { border-color:#111; }
  .tbtn { background:none; border:none; font-size:13px; color:#888; cursor:pointer; padding:6px 0; }
  .tbtn.on { color:#111; font-weight:700; }
  #routeList { overflow-y:auto; padding:2px 8px 12px; -webkit-overflow-scrolling:touch; }
  .rrow { display:flex; align-items:center; gap:10px; padding:11px 8px; border-bottom:1px solid #f5f5f5; cursor:pointer; }
  .rrow.off { opacity:.25; }
  .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .rlabel { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rlabel b { font-weight:700; margin-right:8px; }
  .src { padding:8px 16px 20px; font-size:10px; color:#b0b0b0; line-height:1.7; }
  .src a { color:#b0b0b0; }
  #tripBox { border-bottom:1px solid #ececec; padding:2px 16px 12px; }
  .tsel { flex:1; min-width:0; border:none; border-bottom:1px solid #e0e0e0; padding:8px 2px; font-size:14px; background:transparent; outline:none; border-radius:0; color:#111; }
  #swapBtn { background:none; border:none; font-size:18px; cursor:pointer; color:#111; padding:6px; flex-shrink:0; }
  .tsec { padding:10px 0; border-bottom:1px solid #f2f2f2; font-size:13px; }
  .trow { display:flex; align-items:center; gap:8px; margin:8px 0 4px; }
  .trow b { font-size:13px; }
  .rnum { min-width:26px; height:26px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .tdist { margin-left:auto; font-size:12px; color:#777; white-space:nowrap; }
  .tok { font-size:12px; color:#1a7a3c; font-weight:700; margin-bottom:2px; }
  .twarn { font-size:12px; color:#b35400; font-weight:700; margin-bottom:2px; }
  .ttotal { font-size:13px; font-weight:700; margin-top:8px; }
  .via { color:#777; font-size:12px; line-height:1.6; }
  .tnote { font-size:10px; color:#b0b0b0; margin-top:8px; line-height:1.6; }
  .thint { font-size:11px; color:#999; margin-top:8px; }
  .leaflet-popup-content { font-size:13px; line-height:1.5; margin:12px 14px; }
  @media (min-width:700px){
    .panel { left:auto; right:16px; bottom:16px; top:66px; width:330px; max-height:none; border:1px solid #ececec; border-radius:12px; }
    .panel.hidden { transform:translateX(calc(100% + 24px)); }
    .grab { display:none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <h1><img src="icons/icon-192.png" alt="">BusMap</h1>
  <button class="tlink" id="planToggle">Plan</button>
  <button class="tlink on" id="panelToggle">Routes</button>
</div>

<div class="panel" id="panel">
  <div class="grab" id="grab"><span></span></div>
  <div class="tools">
    <input id="search" type="search" placeholder="Search route no. or place…">
    <button class="tbtn on" id="btnAll">All</button>
    <button class="tbtn" id="btnNone">None</button>
  </div>
  <div id="tripBox" style="display:none;">
    <div style="display:flex;gap:10px;align-items:center;margin:4px 0;">
      <select id="fromSel" class="tsel"></select>
      <button id="swapBtn" title="Swap">&#8646;</button>
      <select id="toSel" class="tsel"></select>
    </div>
    <div id="tripResult"></div>
    <div class="thint">Tip: with Plan on, you can also tap two stops on the map.</div>
  </div>
  <div id="routeList"></div>
  <div class="src">Routes: RTA Kamrup (M) 2019 &middot; ASTC SCR list. Schematic map — some stops approximate. Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const STOPS = {

};

/* ============ 37 CITY BUS ROUTES ============ */
const ROUTES = [
{n:1,from:"Khanapara",to:"Jalukbari",stops:["Khanapara","Six Mile","Dispur Last Gate","Ganeshguri","Bhangagarh","Paltan Bazar","Panbazar","Fancy Bazar","Bharalumukh","Kamakhya Gate","Maligaon Chariali","Jalukbari"]},
{n:2,from:"Basistha Mandir",to:"Jalukbari",stops:["Basistha Mandir","Basistha Chariali","Beltola","Dispur Last Gate","Ganeshguri","Bhangagarh","Paltan Bazar","Fancy Bazar","Bharalumukh","Kamakhya Gate","Maligaon Chariali","Jalukbari"]},
{n:3,from:"Notboma",to:"Jalukbari",stops:["Notboma","Hatigaon Chariali","Dispur Last Gate","Ganeshguri","Bhangagarh","Paltan Bazar","Panbazar","Fancy Bazar","Bharalumukh","Kamakhya Gate","Maligaon Chariali","Jalukbari"]},
{n:4,from:"Church Field",to:"Pandu",stops:["Church Field","Panbazar","Fancy Bazar","Bharalumukh","Kamakhya Gate","Maligaon Chariali","Pandu"]},
{n:5,from:"Kahilipara",to:"Jalukbari",stops:["Kahilipara","Dakhingaon","Ganeshguri","Bhangagarh","Paltan Bazar","Panbazar","Fancy Bazar","Bharalumukh","Kamakhya Gate","Maligaon Chariali","Jalukbari"]},
{n:6,from:"Kachari",to:"Kamakhya Temple",stops:["Kachari","Panbazar","Fancy Bazar","Bharalumukh","Kamakhya Gate","Kamakhya Temple"]},
{n:7,from:"Forest Gate",to:"Jalukbari",stops:["Forest Gate","Chandmari","Silpukhuri","Church Field","Machkhowa","Maligaon Chariali","Jalukbari"]},
{n:8,from:"Khanapara",to:"Jalukbari",stops:["Khanapara","Basistha Chariali","Games Village","Sarusajai Stadium","Lokhra","ISBT Guwahati","Gorchuk","Boragaon","Jalukbari"]},
{n:9,from:"Paltan Bazar",to:"LGBI Airport",stops:["Paltan Bazar","Bharalumukh","Maligaon Chariali","Jalukbari","LGBI Airport"]},
{n:10,from:"Paltan Bazar",to:"Jagiroad",stops:["Paltan Bazar","Bhangagarh","Ganeshguri","Six Mile","Khanapara","Jorabat","Khetri","Jagiroad"]},
{n:11,from:"ISBT Guwahati",to:"Jalukbari",stops:["ISBT Guwahati","Lokhra","Basistha Chariali","Beltola","Dispur Last Gate","Ganeshguri","Assam State Zoo","Zoo Tiniali","Chandmari","Silpukhuri","Church Field","Machkhowa","Maligaon Chariali","Jalukbari"]},
{n:12,from:"Chandrapur",to:"Jalukbari",stops:["Chandrapur","Forest Gate","Noonmati","Anuradha Cinema","Chandmari","Guwahati Club","District Library","Kachari","Bhootnath","Jalukbari"]},
{n:13,from:"ISBT Guwahati",to:"Paltan Bazar",stops:["ISBT Guwahati","Lakhara","Saukuchi","Lalganesh","Birubari","Sarabbhati","Rehabari","Nepali Mandir","Paltan Bazar"]},
{n:14,from:"ISBT Guwahati",to:"Kachari",stops:["ISBT Guwahati","Gorchuk","Katabari","Ganeshpara","Dhirenpara","Ambari","Fatasil","Bharalumukh","Kachari"]},
{n:15,from:"Khanapara",to:"Amingaon",stops:["Khanapara","Basistha Chariali","Games Village","Lalmati","Beharbari","Sarusajai","Lakhara","ISBT Guwahati","Gorchuk","Boragaon","Tetelia","Guwahati University","Jalukbari","Amingaon"]},
{n:16,from:"Lalmati",to:"Jalukbari",stops:["Lalmati","Bhetapara","Hatigaon","Ganeshguri","Christian Basti","ABC Point","Bhangagarh","Lachitnagar","Paltan Bazar","Laktokia","Panbazar","Fancy Bazar","Machkhowa","Bharalumukh","Santipur","Bhootnath","Kamakhya Gate","Maligaon Gate 3","Maligaon Chariali","Adabari","Jalukbari"]},
{n:17,from:"Khanapara",to:"Khanapara (circular)",stops:["Khanapara","Six Mile","Supermarket","Ganeshguri","Assam State Zoo","Zoo Tiniali","Narikal Basti","Gita Mandir","Narengi","Pathar Kuwari","Borbari","Chachal","Six Mile","Khanapara"]},
{n:18,from:"Forest Gate",to:"Amingaon",stops:["Forest Gate","Noonmati","Chandmari","Silpukhuri","Guwahati Club","District Library","Panbazar","Fancy Bazar","Bharalumukh","Bhootnath","Kamakhya Gate","Maligaon Gate 3","Maligaon Chariali","Adabari","Jalukbari","Amingaon"]},
{n:19,from:"Basistha Chariali",to:"Guwahati University",stops:["Basistha Chariali","Games Village","Lalmati","Beharbari","Sarusajai","Lakhara","ISBT Guwahati","Gorchuk","Boragaon","Tetelia","Guwahati University","Jalukbari"]},
{n:20,from:"Basistha Mandir",to:"Kachari",stops:["Basistha Mandir","Chandmari","Kachari"]},
{n:21,from:"Kachari",to:"Adabari",stops:["Kachari","Bharalumukh","Adabari"]},
{n:22,from:"Basistha Mandir",to:"Kachari",stops:["Basistha Mandir","Paltan Bazar","Kachari"]},
{n:23,from:"Khanapara",to:"Kachari",stops:["Khanapara","Ganeshguri","Kachari"]},
{n:24,from:"Lalganesh",to:"Guwahati Club",stops:["Lalganesh","Chandmari","Guwahati Club"]},
{n:25,from:"Notboma",to:"Guwahati Club",stops:["Notboma","Chandmari","Guwahati Club"]},
{n:26,from:"Panjabari",to:"Kachari",stops:["Panjabari","Chandmari","Kachari"]},
{n:27,from:"Kachari",to:"Dharapur",stops:["Kachari","Maligaon Chariali","Dharapur"]},
{n:28,from:"Kachari",to:"Narengi",stops:["Kachari","Chandmari","Narengi"]},
{n:29,from:"Chandrapur",to:"Guwahati Club",stops:["Chandrapur","Noonmati","Chandmari","Guwahati Club"]},
{n:30,from:"Satgaon",to:"Guwahati Club",stops:["Satgaon","Narengi","Zoo Tiniali","Chandmari","Guwahati Club"]},
{n:31,from:"Khanapara",to:"Jalukbari",stops:["Khanapara","Basistha Chariali","Lokhra","ISBT Guwahati","Gorchuk","Jalukbari"]},
{n:32,from:"ISBT Guwahati",to:"Paltan Bazar",stops:["ISBT Guwahati","Lokhra","Lalganesh","Paltan Bazar"]},

{n:37,from:"Byrnihat",to:"Jalukbari",stops:["Byrnihat","Khanapara","Jalukbari"]}
];

/* ============ MAP ============ */
const map = L.map("map", { zoomControl:false }).setView([26.155, 91.79], 12);
L.control.zoom({ position:"bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19, attribution:"&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>"
}).addTo(map);

const colorFor = i => "hsl(" + Math.round((i * 137.5) % 360) + ",72%,44%)";
const routeLayers = {}, stopRoutes = {};

/* stop -> routes index */
ROUTES.forEach(r => r.stops.forEach(s => {
  (stopRoutes[s] = stopRoutes[s] || new Set()).add(r.n);
}));

/* draw routes */
ROUTES.forEach((r, i) => {
  const latlngs = r.stops.map(s => STOPS[s].slice(0,2));
  const line = L.polyline(latlngs, { color:colorFor(i), weight:4, opacity:.85 });
  line.bindPopup("<b class='r'>Route " + r.n + "</b><br>" + r.from + " &rarr; " + r.to +
    "<br><span class='via'>" + r.stops.join(" &rarr; ") + "</span>");
  routeLayers[r.n] = line;
  line.addTo(map);
});

/* draw stops */
const stopMarkers = {};
Object.keys(STOPS).forEach(name => {
  const c = STOPS[name], approx = c[2] === 1;
  const m = L.circleMarker([c[0], c[1]], {
    radius:5, color:"#111", weight:1.5, fillColor:"#fff", fillOpacity:1
  });
  const rs = stopRoutes[name] ? [...stopRoutes[name]].sort((a,b)=>a-b).join(", ") : "—";
  m.bindPopup("<b>" + name + "</b>" + (approx ? " <span style='color:#888'>(approx.)</span>" : "") +
    "<br><span class='via'>Routes: " + rs + "</span>");
  m.addTo(map);
  stopMarkers[name] = m;
  m.on("click", () => { if (tripMode) { map.closePopup(); tapStop(name); } });
});

/* ============ PANEL ============ */
const listEl = document.getElementById("routeList"),
      panel = document.getElementById("panel"),
      visible = new Set(ROUTES.map(r => r.n));

function render(filter) {
  listEl.innerHTML = "";
  const q = (filter || "").trim().toLowerCase();
  let shown = 0;
  ROUTES.forEach((r, i) => {
    const hay = (r.n + " " + r.from + " " + r.to + " " + r.stops.join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return;
    shown++;
    const row = document.createElement("div");
    row.className = "rrow" + (visible.has(r.n) ? "" : " off");
    row.innerHTML = "<span class='dot' style='background:" + colorFor(i) + "'></span>" +
      "<span class='rlabel'><b>" + r.n + "</b>" + r.from + " &rarr; " + r.to + "</span>";
    row.onclick = () => {
      if (visible.has(r.n)) { visible.delete(r.n); map.removeLayer(routeLayers[r.n]); }
      else { visible.add(r.n); routeLayers[r.n].addTo(map); }
      row.classList.toggle("off");
    };
    row.ondblclick = () => { // isolate on double tap
      visible.clear();
      ROUTES.forEach(x => map.removeLayer(routeLayers[x.n]));
      visible.add(r.n); routeLayers[r.n].addTo(map);
      map.fitBounds(routeLayers[r.n].getBounds().pad(0.15));
      render(document.getElementById("search").value);
    };
    listEl.appendChild(row);
  });
  if (!shown) listEl.innerHTML = "<div style='padding:20px;text-align:center;color:#888;font-size:13px'>No routes match.</div>";
}
document.getElementById("search").addEventListener("input", e => render(e.target.value));
document.getElementById("btnAll").onclick = () => {
  ROUTES.forEach(r => { visible.add(r.n); if(!map.hasLayer(routeLayers[r.n])) routeLayers[r.n].addTo(map); });
  document.getElementById("btnAll").classList.add("on"); document.getElementById("btnNone").classList.remove("on");
  render(document.getElementById("search").value);
};
document.getElementById("btnNone").onclick = () => {
  visible.clear(); ROUTES.forEach(r => map.removeLayer(routeLayers[r.n]));
  document.getElementById("btnNone").classList.add("on"); document.getElementById("btnAll").classList.remove("on");
  render(document.getElementById("search").value);
};
const togglePanel = () => {
  panel.classList.toggle("hidden");
  document.getElementById("panelToggle").classList.toggle("on", !panel.classList.contains("hidden"));
};
document.getElementById("panelToggle").onclick = togglePanel;
document.getElementById("grab").onclick = togglePanel;

/* ============ TRIP PLANNER ============ */
const stopNames = Object.keys(STOPS).sort();
const fromSel = document.getElementById("fromSel"), toSel = document.getElementById("toSel");
fromSel.add(new Option("From…", "")); toSel.add(new Option("To…", ""));
stopNames.forEach(n => { fromSel.add(new Option(n, n)); toSel.add(new Option(n, n)); });

let tripMode = false, tripFrom = null, tripTo = null;
const tripLayer = L.layerGroup().addTo(map);

function hav(a, b) {
  const R = 6371, dLa = (b[0]-a[0])*Math.PI/180, dLo = (b[1]-a[1])*Math.PI/180;
  const s = Math.sin(dLa/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function segStops(r, a, b) {           // ordered stop names from a to b along route r
  const i = r.stops.indexOf(a), j = r.stops.indexOf(b);
  return i <= j ? r.stops.slice(i, j+1) : r.stops.slice(j, i+1).reverse();
}
function pathDist(names) {
  let d = 0;
  for (let k = 0; k < names.length-1; k++) d += hav(STOPS[names[k]].slice(0,2), STOPS[names[k+1]].slice(0,2));
  return d;
}
const mins = km => Math.max(1, Math.round(km/20*60));   // ~20 km/h city average
const rBadge = r => "<span class='rnum' style='background:" + colorFor(ROUTES.indexOf(r)) + ";min-width:28px;height:28px;font-size:12px;'>" + r.n + "</span>";

function planTrip() {
  tripLayer.clearLayers();
  const a = fromSel.value, b = toSel.value;
  const res = document.getElementById("tripResult");
  if (!a || !b || a === b) {
    res.innerHTML = "<div style='font-size:12px;color:#666;padding:6px 0;'>Pick two different stops to plan your trip.</div>";
    return;
  }
  let html = "", pathNames = null, transfer = null;
  const direct = ROUTES.filter(r => r.stops.includes(a) && r.stops.includes(b))
    .map(r => { const via = segStops(r, a, b); return { r, via, d: pathDist(via) }; })
    .sort((x, y) => x.d - y.d).slice(0, 3);
  if (direct.length) {
    html = direct.map((o, i) => {
      if (i === 0) pathNames = o.via;
      return "<div class='tsec'>" +
        (i === 0 ? "<div class='tok'>Direct bus — no change needed</div>" : "") +
        "<div class='trow'>" + rBadge(o.r) + "<b>Route " + o.r.n + "</b>" +
        "<span class='tdist'>" + o.d.toFixed(1) + " km &middot; &asymp;" + mins(o.d) + " min</span></div>" +
        "<div class='via'>" + o.via.join(" &rarr; ") + "</div></div>";
    }).join("");
  } else {
    let best = null;
    const rA = ROUTES.filter(r => r.stops.includes(a)), rB = ROUTES.filter(r => r.stops.includes(b));
    for (const r1 of rA) for (const r2 of rB) {
      if (r1.n === r2.n) continue;
      for (const t of r1.stops) {
        if (t === a || t === b || !r2.stops.includes(t)) continue;
        const v1 = segStops(r1, a, t), v2 = segStops(r2, t, b);
        const tot = pathDist(v1) + pathDist(v2);
        if (!best || tot < best.total) best = { r1, r2, t, total: tot, v1, v2 };
      }
    }
    if (best) {
      transfer = best.t; pathNames = best.v1.concat(best.v2.slice(1));
      const d1 = pathDist(best.v1), d2 = pathDist(best.v2);
      html = "<div class='tsec'><div class='twarn'>1 change needed — switch buses at <b>" + best.t + "</b></div>" +
        "<div class='trow'>" + rBadge(best.r1) + "<b>Route " + best.r1.n + "</b>" +
        "<span class='tdist'>" + d1.toFixed(1) + " km &middot; &asymp;" + mins(d1) + " min</span></div>" +
        "<div class='via'>" + best.v1.join(" &rarr; ") + "</div>" +
        "<div class='trow'>" + rBadge(best.r2) + "<b>Route " + best.r2.n + "</b>" +
        "<span class='tdist'>" + d2.toFixed(1) + " km &middot; &asymp;" + mins(d2) + " min</span></div>" +
        "<div class='via'>" + best.v2.slice(1).join(" &rarr; ") + "</div>" +
        "<div class='ttotal'>Total &asymp; " + best.total.toFixed(1) + " km &middot; &asymp;" + mins(best.total) + " min</div></div>";
    } else {
      html = "<div class='tsec'>No bus connection found between these stops.</div>";
    }
  }
  html += "<div style='font-size:10px;color:#999;margin-top:6px;'>Distances are approximate (summed stop-to-stop segments); time assumes &asymp;20 km/h city average.</div>";
  res.innerHTML = html;
  if (pathNames) {
    const ll = pathNames.map(s => STOPS[s].slice(0,2));
    L.polyline(ll, { color:"#fff", weight:9, opacity:.95 }).addTo(tripLayer);
    L.polyline(ll, { color:"#111", weight:5, opacity:1 }).addTo(tripLayer);
    const mk = (s, c) => L.circleMarker([STOPS[s][0], STOPS[s][1]],
      { radius:8, color:"#fff", weight:2, fillColor:c, fillOpacity:1 }).addTo(tripLayer)
      .bindPopup("<b>" + s + "</b>");
    mk(a, "#1a9e4b"); mk(b, "#d23c3c");
    if (transfer) mk(transfer, "#e8a013");
    map.fitBounds(L.latLngBounds(ll).pad(0.2));
  }
}

function tapStop(name) {
  if (!tripFrom || tripTo) { tripFrom = name; tripTo = null; }
  else if (name !== tripFrom) { tripTo = name; }
  fromSel.value = tripFrom;
  if (tripTo) { toSel.value = tripTo; planTrip(); }
  else {
    toSel.value = ""; tripLayer.clearLayers();
    document.getElementById("tripResult").innerHTML =
      "<div style='font-size:12px;color:#666;padding:6px 0;'>From: <b>" + tripFrom + "</b> — now tap your destination stop.</div>";
  }
}

fromSel.onchange = planTrip; toSel.onchange = planTrip;
document.getElementById("swapBtn").onclick = () => {
  const t = fromSel.value; fromSel.value = toSel.value; toSel.value = t; planTrip();
};
document.getElementById("planToggle").onclick = () => {
  tripMode = !tripMode;
  document.getElementById("planToggle").classList.toggle("on", tripMode);
  document.getElementById("tripBox").style.display = tripMode ? "block" : "none";
  if (tripMode) {
    panel.classList.remove("hidden");
    document.getElementById("btnNone").click();
    fromSel.value = ""; toSel.value = "";
    tripFrom = tripTo = null;
    planTrip();
  } else {
    tripLayer.clearLayers(); tripFrom = tripTo = null;
  }
};

render("");

/* register service worker for installable offline PWA */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
